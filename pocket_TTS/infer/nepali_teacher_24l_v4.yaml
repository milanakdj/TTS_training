# Inference config for the v4 24-layer bilingual teacher, FINAL step-250000
# EMA export. Same architecture as the v3 teacher, same grafted tokenizer, but
# trained with the v4 recipe (5% English replay, unpinned inherited rows) --
# see pocket-tts-v4-bilingual-recipe memory / docs/V4_RECIPE.md.
#
# NOTE: the pocket_tts inference path has no cfg_coef, and this teacher was
# only ever sampled with guidance (sample_cfg_coef 2.0) during training and
# distillation. Loading it through TTSModel the normal way measures the
# UNGUIDED teacher -- not the model the student was distilled from, and not
# representative of deployed quality. Use the student for anything except
# re-distillation.
weights_path: /workspace/v4_teacher_24l/model.safetensors

default_temperature: 0.3
flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 6
    dim: 512
  transformer:
    d_model: 1024
    hidden_scale: 4
    max_period: 10000
    num_heads: 16
    num_layers: 24
  lookup_table:
    dim: 1024
    n_bins: 9682
    tokenizer: sentencepiece
    tokenizer_path: /root/tts/TTS_training/pocket_TTS/tokenizer_v3/ne_en_9682.model
mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 512
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 512
