# v3 stage 2: 6-layer student depth-distilled from the v3 teacher.
#
# Identical recipe to nepali_distill.yaml -- distill_cfg_coef 2.0 bakes in the
# guidance that the inference path cannot express -- with the v3 tokenizer and
# vocabulary size threaded through both student and teacher. The student is built
# fresh (start_from_pretrained: false), so there is no embedding to graft here;
# graft_text_embedding applies only to stage 1.
model_config: pocket_tts/config/english.yaml   # 6-layer student
model_overrides:
  flow_lm.lookup_table.tokenizer_path: /root/tts/TTS_training/pocket_TTS/tokenizer_v3/ne_en_9682.model
  flow_lm.lookup_table.n_bins: 9682
start_from_pretrained: false
distill_cfg_coef: 2.0
distill_teacher_config: pocket_tts/config/english.yaml
distill_teacher_overrides:
  flow_lm.transformer.num_layers: 24
  flow_lm.lookup_table.tokenizer_path: /root/tts/TTS_training/pocket_TTS/tokenizer_v3/ne_en_9682.model
  flow_lm.lookup_table.n_bins: 9682
# builders.py does a plain torch.load here and reads payload["ema"], so this must
# be a local TRAINING checkpoint -- an hf:// path or the safetensors export will
# not work. Set after stage 1 finishes:
distill_teacher_weights: /workspace/nepali_teacher_24l_v3/checkpoint_00200000.pt

data:
  train_jsonl: /root/tts/TTS_training/pocket_TTS/manifests/train_v3_aligned.jsonl
  valid_jsonl: /root/tts/TTS_training/pocket_TTS/manifests/valid_v3_aligned.jsonl

flow:
  type: lsd
  kwargs: {}

text_dropout: 0.0
voice_dropout: 0.0

optim:
  lr: 4e-4
  schedule: cosine
  warmup_steps: 1000

run_dir: /workspace/nepali_student_6l_v3
batch_size: 64
grad_accum_steps: 1
max_steps: 200000
ema_decay: 0.9999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
num_ckpt_keep: 999
