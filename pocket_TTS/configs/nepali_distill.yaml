# Depth distillation: a 6-layer student learns the backbone activations of a
# trained 24-layer teacher. Same d_model, so the flow head and all non-backbone
# weights are copied from the teacher and the head stays frozen.
#
# distill_cfg_coef 2.0 bakes guidance in (the README's parity recipe);
# 1.0 = pure depth distillation.
model_config: pocket_tts/config/english.yaml   # 6-layer student
model_overrides:
  flow_lm.lookup_table.tokenizer_path: /root/tts/TTS_training/pocket_TTS/tokenizer/nepali_bpe4000.model
start_from_pretrained: false
distill_cfg_coef: 2.0
distill_teacher_config: pocket_tts/config/english.yaml
distill_teacher_overrides:
  flow_lm.transformer.num_layers: 24
  flow_lm.lookup_table.tokenizer_path: /root/tts/TTS_training/pocket_TTS/tokenizer/nepali_bpe4000.model
# The local run dir was deleted; this file now lives on the Hub at
# milanakdj/pocket-tts-nepali-24l-teacher under training/checkpoint_00200000.pt.
# It CANNOT be given as an hf:// path -- builders.py does a plain
# torch.load(distill_teacher_weights) and also reads payload["ema"], the EMA shadow,
# which the safetensors export has already merged in and cannot be recovered from.
# So to distil a new student, download it first and point this at the local copy:
#   hf download milanakdj/pocket-tts-nepali-24l-teacher \
#     training/checkpoint_00200000.pt --local-dir /workspace/teacher
distill_teacher_weights: /workspace/teacher/training/checkpoint_00200000.pt

data:
  train_jsonl: /root/tts/TTS_training/pocket_TTS/manifests/train_v2_aligned.jsonl
  valid_jsonl: /root/tts/TTS_training/pocket_TTS/manifests/valid_v2_aligned.jsonl

flow:
  type: lsd
  kwargs: {}

# No CFG dropout: the teacher's targets are always computed fully-conditioned
# (both z_cond and z_null come from dropout=False passes), and the student is
# never run with a null branch at inference. Dropping conditioning here would
# ask the student to predict the conditioned target from a null input.
text_dropout: 0.0
voice_dropout: 0.0

optim:
  lr: 4e-4  # screened {1,2,4}e-4 on full mini-cosines: 4e-4 clearly best
  schedule: cosine
  warmup_steps: 1000

# run_dir moved off / (88% full, 213G free): ckpt_freq 2500 x num_ckpt_keep 999
# over 200k steps keeps ~80 checkpoints, which would not fit. /workspace has 852T.
run_dir: /workspace/nepali_student_6l
batch_size: 64
grad_accum_steps: 1
max_steps: 200000  # WER is at parity by ~50k; sim and UTMOS climb until ~150k
ema_decay: 0.9999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
num_ckpt_keep: 999
